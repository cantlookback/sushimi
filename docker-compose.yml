services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sushimi}
      POSTGRES_USER: ${POSTGRES_USER:-sushimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushimi}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-sushimi}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-sushimi-local-secret}
      S3_BUCKET: ${S3_BUCKET:-sushimi-media}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - media_data:/data

volumes:
  postgres_data:
  media_data:
