services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sushimi}
      POSTGRES_USER: ${POSTGRES_USER:-sushimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-sushimi}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-sushimi-media}
    volumes:
      - media_data:/data

  app:
    image: ${APP_IMAGE:-cantlookback/sushimi:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sushimi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sushimi}
      S3_ENDPOINT: http://object-storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sushimi-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sushimi}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/sushimi}
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000'+process.env.NEXT_PUBLIC_BASE_PATH+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  media_data:
